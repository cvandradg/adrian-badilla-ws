<div class="admin-shell">
  <!-- ── Top bar ─────────────────────────────────────────────────────────── -->
  <header class="admin-shell__topbar">
    <div class="topbar-inner">
      <div class="topbar-brand">
        <img
          src="/global/assets/img/ab-logo-circle.svg"
          alt="Adrián Badilla"
          class="brand-logo"
        />
        <span class="brand-name">Admin</span>
      </div>

      <nav class="topbar-nav">
        <a
          class="topbar-nav__item"
          routerLink="/admin"
          routerLinkActive="topbar-nav__item--active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <i class="pi pi-th-large"></i>
          <span>Dashboard</span>
        </a>
        <a
          class="topbar-nav__item"
          routerLink="/admin/exercise-library"
          routerLinkActive="topbar-nav__item--active"
        >
          <i class="pi pi-book"></i>
          <span>Ejercicios</span>
        </a>
      </nav>

      <div class="topbar-actions">
        <p-button
          icon="pi pi-arrow-left"
          label="Volver"
          severity="secondary"
          [text]="true"
          size="small"
          routerLink="/dashboard/inicio"
        />
      </div>
    </div>
  </header>

  <!-- ── Content ─────────────────────────────────────────────────────────── -->
  <main class="admin-shell__content">
    <router-outlet />
  </main>
</div>
