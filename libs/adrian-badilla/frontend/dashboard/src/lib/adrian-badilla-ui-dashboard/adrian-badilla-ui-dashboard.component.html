<mat-sidenav-container class="dashboard-shell" [autosize]="true">
  <mat-sidenav
    #left
    class="left-sidenav"
    [position]="isNarrow() ? 'end' : 'start'"
    [mode]="isNarrow() ? 'over' : 'side'"
    [opened]="!isNarrow()"
    [style.width]="leftWidth()"
    [style.height]="drawerHeight()"
    [class.is-collapsed]="collapsed()"
  >
    <adrian-badilla-side-menu
      [collapsed]="collapsed()"
      (menuItemSelected)="onLeftNavigationItemSelected(left)"
    />
  </mat-sidenav>

  <mat-sidenav
    #right
    class="right-sidenav"
    [position]="isNarrow() ? 'start' : 'end'"
    [mode]="isNarrow() ? 'over' : 'side'"
    [opened]="!isNarrow() && rightPinnedOpen()"
    [style.width]="rightWidth()"
    [style.height]="drawerHeight()"
  >
    <adrian-badilla-description-side-panel />
  </mat-sidenav>

  <mat-sidenav-content
    class="dashboard-content"
    [style.margin-left]="marginLeft()"
    [style.margin-right]="marginRight()"
  >
    <div class="dashboard-container">
      <div class="container-header">
        <div class="header-start inline-flex gap-3">
          <img
            src="/global/assets/img/ab-logo-circle.svg"
            alt="Adrián Badilla"
            class="navbar-logo"
          />
          <fa-icon
            [icon]="['fas', 'bars']"
            class="fa-lg menu-toggle"
            appTourAnchor="hamburger-menu"
            (click)="onMenuClick(left)"
            (keydown.enter)="onMenuClick(left)"
            tabindex="0"
            role="button"
            aria-label="Abrir menú de navegación"
          />
        </div>

        <div class="header-actions">
          <div class="header-login-group">
            @if (isScraperRunning()) {
            <div class="header-run-indicator" aria-live="polite">
              <i
                class="pi pi-spinner pi-spin header-run-indicator__icon"
                aria-hidden="true"
              ></i>
              <span>Actualizando Órdenes</span>
            </div>
            }

            <button
              type="button"
              class="login-button"
              (click)="onUserProfileClick()"
              aria-label="Perfil de usuario"
            >
              <fa-icon [icon]="['fas', 'user']"></fa-icon>
              <span>Ingresar</span>
            </button>
          </div>

          <fa-icon
            [icon]="['fass', 'toggle-on']"
            class="fa-lg ml-2"
            [class.fa-rotate-180]="!isNarrow() && !rightPinnedOpen()"
            [style.color]="
              !isNarrow() && rightPinnedOpen()
                ? '#6b7280'
                : 'var(--dashboard-text-soft)'
            "
            (click)="onRightToggle(right)"
            (keydown.enter)="onRightToggle(right)"
            tabindex="0"
            role="button"
            aria-label="Alternar panel derecho"
          ></fa-icon>
        </div>
      </div>

      <div class="router-slot">
        <router-outlet />
      </div>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>

@if (needsOnboarding()) {
<lib-profile-setup />
}
