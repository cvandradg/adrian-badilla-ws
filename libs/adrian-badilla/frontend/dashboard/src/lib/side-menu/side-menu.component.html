<div class="sidenav-header" [class.sidenav-header--collapsed]="sideNavCollapsed()">

  <!-- Avatar -->
  <div class="profile-avatar">
    @if (photoURL()) {
      <img class="profile-avatar__img" [src]="photoURL()!" alt="Foto de perfil" loading="lazy" />
    } @else {
      <div class="profile-avatar__initials">{{ initials() }}</div>
    }
    <div class="profile-avatar__status" aria-hidden="true"></div>
  </div>

  <!-- Name + badge (hidden when collapsed) -->
  @if (!sideNavCollapsed()) {
    <div class="profile-info">
      <span class="profile-info__name">{{ displayName() }}</span>
      <span class="profile-info__badge">
        <i class="pi pi-bolt" aria-hidden="true"></i>
        Activo
      </span>
    </div>
  }

</div>
<mat-nav-list>
  @for (item of menuItems(); track item) {
  <a
    mat-list-item
    [routerLink]="item.route"
    routerLinkActive="menu-item--active"
    [routerLinkActiveOptions]="{ exact: true }"
    #rla="routerLinkActive"
    [activated]="rla.isActive"
    class="menu-item"
  >
    <fa-icon matListItemIcon [icon]="item.icon"></fa-icon>

    @if (!sideNavCollapsed()) {
    <span matListItemTitle>{{ item.label }}</span>
    }
  </a>
  }
</mat-nav-list>
