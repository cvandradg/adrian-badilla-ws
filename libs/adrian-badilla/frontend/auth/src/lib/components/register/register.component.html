<div class="container">
  <div class="title">Crea tu cuenta</div>
  <div class="description">Recuerda crear una contraseña segura.</div>

  <div class="register-login-inputs">
    <form [formGroup]="loginInputForm" class="form-register-inputs">
      <mat-form-field>
        <mat-label>Correo</mat-label>
        <input
          matInput
          placeholder="tucorreo@dominio.com"
          type="email"
          required="true"
          formControlName="user"
        />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Contraseña</mat-label>
        <input
          matInput
          placeholder="EjemploDeClave1!"
          type="password"
          required="true"
          formControlName="pass"
        />
      </mat-form-field>
    </form>

    <div class="horizontal-animation">
      <button
        mat-button
        (click)="firebaseAuthStore.createAccount(credentials())"
        [disabled]="firebaseAuthStore.registerLoading()"
      >
        <div class="register-button">
          <p>Crear Cuenta</p>

          @if (!firebaseAuthStore.registerLoading() &&
          !firebaseAuthStore.registerSuccess()) {
          <fa-icon
            [icon]="['fas', 'arrow-right']"
            class="icon fa-xl fa-shake"
            style="--fa-animation-iteration-count: 2"
          />
          } @if (firebaseAuthStore.registerLoading()) {
          <fa-icon
            [icon]="['fas', 'spinner-third']"
            class="icon fa-xl fa-spin"
            style="--fa-animation-duration: 1s"
          />
          } @if (!firebaseAuthStore.registerLoading() &&
          firebaseAuthStore.registerSuccess()) {
          <fa-icon
            [icon]="['fas', 'check']"
            class="icon fa-xl fa-shake"
            style="--fa-animation-iteration-count: 2"
          />
          }
        </div>
      </button>
    </div>

    <div class="centered">
      <adrian-badilla-status-message
        [type]="'info'"
        [icon]="['fas', 'circle-info']"
        [message]="'Creando tu cuenta...'"
        [display]="firebaseAuthStore.registerLoading()"
      />

      <adrian-badilla-status-message
        [type]="'error'"
        [icon]="['fas', 'xmark']"
        [message]="firebaseAuthStore.registerError() || ''"
        [display]="
          !!firebaseAuthStore.registerError() &&
          !firebaseAuthStore.registerLoading()
        "
      />

      <adrian-badilla-status-message
        [type]="'success'"
        [icon]="['fas', 'check']"
        [message]="
          'Cuenta creada. Te enviamos un correo para verificar tu cuenta. Revisa Spam/Promociones.'
        "
        [display]="
          firebaseAuthStore.registerSuccess() &&
          !firebaseAuthStore.registerLoading()
        "
      />
    </div>

    @if (firebaseAuthStore.registerSuccess() &&
    !firebaseAuthStore.registerLoading()) {
    <div class="horizontal-animation">
      <button mat-button [routerLink]="'/login'">
        <div class="register-button">
          <p>Volver al Login</p>
          <fa-icon [icon]="['fas', 'arrow-right']" class="icon fa-xl" />
        </div>
      </button>
    </div>

    <div class="horizontal-animation">
      <button mat-button (click)="firebaseAuthStore.sendEmailVerification()">
        <div class="register-button">
          <p>Reenviar verificación</p>
          <fa-icon [icon]="['fas', 'paper-plane']" class="icon fa-xl" />
        </div>
      </button>
    </div>
    }

    <adrian-badilla-strength-meter></adrian-badilla-strength-meter>
  </div>
</div>
