<ng-container>
  <div class="forgot-password">
    <button
      mat-button
      data-cy="go-passreset"
      (click)="firebaseAuthStore.passReset(user)"
    >
      <p>Recuperar Contraseña</p>

      @if (firebaseAuthStore.passResetLoading()) {
      <fa-icon
        [icon]="['fas', 'spinner-third']"
        class="icon fa-xl fa-spin"
        style="--fa-animation-duration: 1s"
      />
      }
    </button>
  </div>

  @if (firebaseAuthStore.passResetSuccess()) {
  <adrian-badilla-status-message
    [type]="'success'"
    [icon]="['fas', 'check']"
    [message]="
      'Si el correo es válido te llegará un link para cambiar tu contraseña.'
    "
    [display]="true"
  />
  } @if (firebaseAuthStore.passResetError()) {
  <adrian-badilla-status-message
    [type]="'error'"
    [icon]="['fas', 'xmark']"
    [message]="firebaseAuthStore.passResetError()"
    [display]="true"
  />
  }
</ng-container>
