@let summary = weeklySummary();

<lib-routines-info-column
  [summary]="summary"
  [currentWeekTitle]="currentWeekTitle"
/>

<div class="routines-tabs">
  <div class="card">
    <p-tabs value="rutinas" class="routines-tabs-root">
      <p-tablist class="routines-tablist">
        @for (tab of topTabs; track tab.value) {
        <p-tab [value]="tab.value" class="routines-tab">
          <fa-icon [icon]="tab.icon" class="tab-icon fa-xl" />
          <span>{{ tab.label }}</span>
        </p-tab>
        }
      </p-tablist>

      <p-tabpanels>
        <p-tabpanel value="modificaciones-de-rutinas">
          <div class="routines-placeholder routines-placeholder--empty" aria-label="Modificaciones de rutinas"></div>
        </p-tabpanel>

        <p-tabpanel value="rutinas">
          <lib-routines-breakdown
            [summary]="summary"
            [routineStartDate]="routineStartDate()"
            [routineEndDate]="routineEndDate()"
            [maxRoutineDate]="maxRoutineDate"
            [filteredRoutineDays]="filteredRoutineDays()"
            [searchQuery]="searchQuery()"
            (startDateSelect)="onStartDateSelect($event)"
            (endDateSelect)="onEndDateSelect($event)"
            (printRoutines)="onPrintRoutines()"
            (searchQueryChange)="updateSearchQuery($event)"
          />
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  </div>
</div>
