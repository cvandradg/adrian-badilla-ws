<div class="news-card">
  <div class="news-card__image-wrapper">
    <img [src]="news().image" [alt]="news().title" class="news-card__image" />
    <p-tag
      [value]="news().category"
      [severity]="getCategorySeverity(news().category)"
      class="news-card__tag"
    />
  </div>
  <div class="news-card__content">
    <h3 class="news-card__title">{{ news().title }}</h3>
    <p class="news-card__description">{{ news().description }}</p>
    <span class="news-card__date">{{ news().date | date: 'dd MMM yyyy' }}</span>
  </div>
</div>
