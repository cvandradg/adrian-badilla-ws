<!-- ============ LOADER ============ -->
<div data-ab-loader style="position:fixed; inset:0; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:34px; background:radial-gradient(circle at 50% 42%, #0d0f0e 0%, #070707 60%); transition:opacity .7s ease, visibility .7s ease; opacity:1; visibility:visible;">
  <div style="position:absolute; top:50%; left:50%; width:520px; height:520px; max-width:90vw; max-height:90vw; transform:translate(-50%,-58%); border-radius:50%; background:radial-gradient(circle, hsl(356 88% 53% / .12) 0%, transparent 62%); filter:blur(8px);"></div>
  <div style="position:relative; width:150px; height:150px; display:flex; align-items:center; justify-content:center;">
    <div style="position:absolute; inset:0; border-radius:50%; border:2px solid rgba(255,255,255,.06); border-top-color:hsl(356 88% 53% / .85); animation:ab-spin .9s linear infinite;"></div>
    <div style="position:absolute; inset:14px; border-radius:50%; border:2px solid rgba(255,255,255,.04); border-bottom-color:hsl(356 88% 53% / .45); animation:ab-spin-rev 1.5s linear infinite;"></div>
    <svg viewBox="0 0 120 120" style="position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg);"><circle cx="60" cy="60" r="54" fill="none" stroke="hsl(356 88% 53%)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="339" style="animation:ab-ring 2s ease-in-out infinite; filter:drop-shadow(0 0 6px hsl(356 88% 53% / .6));"></circle></svg>
    <img src="/global/assets/img/ab-logo-circle.svg" alt="Adrián Badilla" style="position:relative; width:74px; height:74px; object-fit:contain; filter:drop-shadow(0 0 18px hsl(356 88% 53% / .5)); animation:ab-glow 1.8s ease-in-out infinite;">
  </div>
  <div style="text-align:center;">
    <div class="ab-shimmer" style="font-family:'Anton',sans-serif; font-size:clamp(1.4rem,3vw,2rem); text-transform:uppercase; letter-spacing:.14em; line-height:1;">Adrián Badilla</div>
    <div style="display:flex; align-items:center; justify-content:center; gap:8px; margin-top:14px;">
      <span style="font-family:'Anton',sans-serif; letter-spacing:.42em; font-size:12px; text-transform:uppercase; color:rgba(255,255,255,.45);">Cargando</span>
      <span style="display:flex; gap:4px;"><span style="width:5px;height:5px;border-radius:50%;background:hsl(356 88% 53%);animation:ab-dots 1.2s infinite;animation-delay:0s;"></span><span style="width:5px;height:5px;border-radius:50%;background:hsl(356 88% 53%);animation:ab-dots 1.2s infinite;animation-delay:.2s;"></span><span style="width:5px;height:5px;border-radius:50%;background:hsl(356 88% 53%);animation:ab-dots 1.2s infinite;animation-delay:.4s;"></span></span>
    </div>
  </div>
  <div style="position:absolute; bottom:0; left:0; right:0; height:2px; background:rgba(255,255,255,.05); overflow:hidden;">
    <div style="position:absolute; inset:0; width:50%; background:linear-gradient(90deg, transparent, hsl(356 88% 53%), transparent); animation:ab-loadbar 1.4s ease-in-out infinite;"></div>
  </div>
</div>
