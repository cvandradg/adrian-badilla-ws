<nav class="navbar" aria-label="Menú principal">
  <div class="logo">
    <img
      src="/global/assets/img/ab-logo-circle.svg"
      alt="Logotipo Adrián Badilla"
      class="logo-img"
    />
  </div>

  <button 
    class="navbar-toggle" 
    aria-label="Abrir menú"
    (click)="toggleMenu()"
    [attr.aria-expanded]="isMenuOpen()"
  >
    <span aria-hidden="true">&#9776;</span>
  </button>

  <ul class="nav-links">
    <li><a href="#">Contáctanos</a></li>
    <li><a href="#">Eventos</a></li>
    <li><a href="#">Regístrate</a></li>
  </ul>

  <button
    class="cta"
    type="button"
    [routerLink]="'/auth/login'"
    aria-label="Inicia tu proyecto"
  >
    Inicia tu proyecto
  </button>
</nav>

<!-- Mobile Drawer -->
<p-drawer
  [(visible)]="isMenuOpen"
  position="top"
  styleClass="mobile-drawer"
  [modal]="false"
  [dismissible]="true"
  [showCloseIcon]="false"
>
  <ng-template #header>
    <div class="drawer-header">
      <img
        src="/global/assets/img/ab-logo-circle.svg"
        alt="Adrián Badilla"
        class="drawer-logo"
      />
      <button class="drawer-close" (click)="closeMenu()" aria-label="Cerrar menú">
        <span>&#x2715;</span>
      </button>
    </div>
  </ng-template>

  <nav class="drawer-nav" aria-label="Menú móvil">
    <a href="#" class="drawer-link" (click)="closeMenu()">
      <span class="drawer-link__icon">&#9993;</span>
      <span class="drawer-link__text">Contáctanos</span>
    </a>
    <a href="#" class="drawer-link" (click)="closeMenu()">
      <span class="drawer-link__icon">&#127882;</span>
      <span class="drawer-link__text">Eventos</span>
    </a>
    <a href="#" class="drawer-link" (click)="closeMenu()">
      <span class="drawer-link__icon">&#128100;</span>
      <span class="drawer-link__text">Regístrate</span>
    </a>
  </nav>

  <div class="drawer-footer">
    <button
      class="drawer-cta"
      type="button"
      [routerLink]="'/auth/login'"
      (click)="closeMenu()"
    >
      Inicia tu proyecto
    </button>
  </div>
</p-drawer>
