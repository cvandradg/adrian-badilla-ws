<div class="purchase-orders-tabs">
  <div class="card">
    <p-tabs value="rutas" class="purchase-orders-tabs-root">
      <p-tablist class="purchase-orders-tablist">
        @for (tab of tabs; track tab.route) {
        <p-tab
          [value]="tab.route"
          class="flex items-center !gap-2 text-inherit"
        >
          <fa-icon [icon]="tab.icon" class="tab-icon fa-xl" />
          <span>{{ tab.label }}</span>
        </p-tab>
        }
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel value="diets"> <lib-adrian-badilla-diets /> </p-tabpanel>
        <p-tabpanel value="productos">
          <lib-macro-progress-tracker />
        </p-tabpanel>
        <p-tabpanel value="apariencia">
          <lib-adrian-badilla-diets />
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  </div>
</div>
