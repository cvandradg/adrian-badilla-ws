<div class="routines-page">

  <!-- ── Scrollable timeline area ─────────────────────────────────────── -->
  <div class="routines-page__timeline">
    <lib-shared-item-timeline
      [days]="routineDayBases()"
      [selectedDayId]="selectedRoutineDayId()"
      [completedDayIds]="completedRoutineDayIds()"
      [items]="ensureRoutineLoaded()"
      [isTimelineComplete]="isSelectedDayComplete()"
      (daySelected)="selectDay($event)"
      (statusChange)="handleStatusChange($event)"
      (openChat)="openChat($event)"
      (itemDetails)="openDetails($event)"
    />
  </div>

  <!-- ── Progress tracker pinned at bottom ────────────────────────────── -->
  <lib-routine-progress-tracker
    class="routines-page__tracker"
    [metrics]="progressMetrics()"
  />

</div>
