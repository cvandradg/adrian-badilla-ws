<lib-decision-card
  [item]="decisionItem()"
  (statusChange)="statusChange.emit($event)"
  (openDetails)="openDetails.emit($event)"
  (openChat)="openChat.emit($event)"
>
  <div card-name class="decision-card-name">
    {{ routine().name }}
  </div>

  <div extra-content class="decision-extra-content">
    @for (exercise of routine().exercises; track exercise) {
      <span class="decision-chip">🏋️ {{ exercise }}</span>
    }
  </div>

  <div dropdown-content>
    <lib-exercise-dropdown [exercises]="routine().exercises" />
  </div>
</lib-decision-card>
