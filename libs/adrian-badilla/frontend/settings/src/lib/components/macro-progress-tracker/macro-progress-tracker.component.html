<div class="macro-bar">

  <span class="bar-score" [style.color]="ringColor()">{{ Math.round(macroSnapshot().percentages.average.percentage) }}%</span>
  <span class="bar-dot">·</span>
  <span class="bar-status" [ngClass]="statusChipClass()">{{ statusLabel() }}</span>

  <div class="bar-divider"></div>

  @for (chip of macroChips(); track chip.key) {
    <span class="m-chip" [ngClass]="[chip.colorClass, chip.stateClass]">
      <span class="m-chip__icon">{{ chip.icon }}</span>{{ chip.label }}
    </span>
  }

  @if (showCalories() && totalCalories() > 0) {
    <span class="bar-kcal">{{ formatNumber(totalCalories()) }} kcal</span>
  }

</div>
