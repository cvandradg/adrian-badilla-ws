<nav class="routes-nav">
  <div
    libScrollableListState
    class="routes-nav__scroll"
  >
    <ul class="routes-nav__list" [style.--active-index]="activeRouteIndex()">
      @for (route of routes(); track route.id; let i = $index) {
      <li class="routes-nav__item-wrapper">
        <div
          class="routes-nav__item-row"
          [class.routes-nav__item-row--editing]="isEditorMode()"
        >
          <button
            type="button"
            class="routes-nav__item"
            [class.routes-nav__item--active]="route.id === selectedRouteId()"
            (click)="selectRoute(route.id)"
          >
            <div class="tabs-inner-content">
              <fa-icon
                [icon]="['fas', 'user']"
                [style.font-size]="'1rem'"
              ></fa-icon>

              <div class="route-name">
                <div>{{ route.name }}</div>
                @if (route.description) {
                <div class="tab-description">{{ route.description }}</div>
                }
              </div>
            </div>
          </button>

          @if (isEditorMode()) {
          <button
            type="button"
            class="routes-nav__delete"
            (click)="requestRouteDelete(route, $event)"
            [attr.aria-label]="'Eliminar ' + (route.name || 'ruta')"
          >
            <fa-icon [icon]="['fas', 'trash-can']"></fa-icon>
          </button>
          }
        </div>
      </li>
      }
    </ul>
  </div>

  <button
    type="button"
    class="routes-nav__arrow routes-nav__arrow--up"
    aria-label="Ver rutas anteriores"
  >
    <i class="pi pi-chevron-up routes-nav__arrow-icon"></i>
  </button>

  <button
    type="button"
    class="routes-nav__arrow routes-nav__arrow--down"
    aria-label="Ver rutas siguientes"
  >
    <i class="pi pi-chevron-down routes-nav__arrow-icon"></i>
  </button>
</nav>
