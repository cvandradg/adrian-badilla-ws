<lib-decision-card
  [item]="decisionItem()"
  (statusChange)="handleStatusChange($event)"
  (openChat)="openChat.emit($event)"
  (openDetails)="mealDialogRequested.emit($event)"
>
  <div card-name class="decision-card-name">{{ fixedMeal().name }}</div>

  <div extra-content class="decision-extra-content">
    <span class="decision-macro decision-macro--protein">🥩 {{ roundUp(fixedMeal().macros.protein) }}g</span>
    <span class="decision-macro decision-macro--carbs">🍞 {{ roundUp(fixedMeal().macros.carbs) }}g</span>
    <span class="decision-macro decision-macro--fats">🥑 {{ roundUp(fixedMeal().macros.fats) }}g</span>
  </div>

  <div dropdown-content>
    <div class="decision-dropdown__title">🍳 Preparación</div>
    <p class="decision-dropdown__text">{{ preparationSummary() }}</p>
  </div>
</lib-decision-card>
