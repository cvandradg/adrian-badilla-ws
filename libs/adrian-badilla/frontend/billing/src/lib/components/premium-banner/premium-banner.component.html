<div class="premium-banner">
  <span class="premium-banner__badge">PREMIUM</span>

  <div class="premium-banner__icon-ring">
    <i class="pi pi-star-fill premium-banner__icon"></i>
  </div>

  <h3 class="premium-banner__title">Desbloquea Premium</h3>

  <p class="premium-banner__message">
    Accede a IA avanzada, analíticas y planes ilimitados.
  </p>

  <ul class="premium-banner__features">
    <li>
      <i class="pi pi-check-circle"></i>
      IA nutricional avanzada
    </li>
    <li>
      <i class="pi pi-check-circle"></i>
      Planes de entrenamiento ilimitados
    </li>
    <li>
      <i class="pi pi-check-circle"></i>
      Analíticas detalladas
    </li>
  </ul>

  <button class="premium-banner__cta" (click)="onUpgrade()" type="button">
    <i class="pi pi-star"></i>
    Obtener Premium
  </button>

  <p class="premium-banner__note">Cancela cuando quieras · Sin permanencia</p>
</div>
